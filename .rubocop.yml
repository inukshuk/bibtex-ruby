# See https://docs.rubocop.org/rubocop/configuration

inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  # Opt into new cops as they are released instead of listing them one by
  # one. Offenses from newly enabled cops end up in .rubocop_todo.yml when
  # it is regenerated.
  NewCops: enable
  # TargetRubyVersion is inferred from required_ruby_version in the gemspec.
  Exclude:
    - lib/bibtex/name_parser.rb # generated by Racc
    - lib/bibtex/parser.rb # generated by Racc
    - vendor/**/*

Layout/LineLength:
  Max: 150

# Test classes and nested Minitest::Spec `describe` blocks grow with the
# behaviour they cover; splitting them to satisfy length limits would be
# artificial. `inherit_mode` keeps the Exclude lists from .rubocop_todo.yml.
Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'test/**/*'

# A test may check a handful of related properties of a single result.
Minitest/MultipleAssertions:
  Max: 6
